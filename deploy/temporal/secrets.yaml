# The PostgreSQL password for the self-hosted Temporal, from Key Vault
# (main.bicep writes it as temporal-postgres-password), under Temporal's own
# identity (main.bicep output temporalClientId). The CSI driver also keeps a
# Kubernetes Secret of it while a Temporal pod mounts it, because the chart
# reads the password from a Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal
  annotations:
    azure.workload.identity/client-id: REPLACE-temporalClientId
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: temporal-postgres
spec:
  provider: azure
  secretObjects:
    - secretName: temporal-postgres
      type: Opaque
      data:
        - objectName: temporal-postgres-password
          key: password
  parameters:
    clientID: REPLACE-temporalClientId
    keyvaultName: REPLACE-keyVaultName
    tenantId: REPLACE-tenantId
    objects: |
      array:
        - |
          objectName: temporal-postgres-password
          objectType: secret
---
# The core's workers, and nothing else in the cluster, reach the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: insurance-core
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ic-worker", "ic-close", "ic-unit-orders", "ic-finance-close"]
        - podSelector: {}
      ports:
        - port: 7233

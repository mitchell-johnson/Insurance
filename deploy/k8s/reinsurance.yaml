# The reinsurance driver (docs/reinsurance.md). It carries the reinsurance
# module's instructions from its group on the ledger nodes to the partitions
# and its notices to whoever they are for: other modules on the nodes, the
# write-once records container, and the event hub reinsurance operations
# are alerted from. It holds no state.
#
# It runs under an identity of its own, which may write to that container,
# send to that hub and read the cluster token. Set the values marked REPLACE
# from the outputs of infra/reinsurance.bicep and infra/main.bicep.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ic-reinsurance
  annotations:
    azure.workload.identity/client-id: REPLACE-reinsuranceIdentityClientId
---
# The cluster token, mounted as a file under the driver's identity. It never
# becomes a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ic-reinsurance-token
spec:
  provider: azure
  parameters:
    clientID: REPLACE-reinsuranceIdentityClientId
    keyvaultName: REPLACE-keyVaultName
    tenantId: REPLACE-tenantId
    objects: |
      array:
        - |
          objectName: cluster-token
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-reinsurance
spec:
  # Two, so delivery carries on when one dies. Both may run at once: the core
  # applies each instruction once, a record's name is written once, and a
  # notice published twice carries the same ID.
  replicas: 2
  selector:
    matchLabels:
      app: ic-reinsurance
  template:
    metadata:
      labels:
        app: ic-reinsurance
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ic-reinsurance
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driver
          image: insurance-core
          command: ["/usr/local/bin/ic-reinsurance"]
          envFrom:
            - configMapRef:
                name: ic-ledger
            # IC_BLOB_ENDPOINT and IC_EVENT_HUBS_ENDPOINT. The container and
            # hub have the names infra/reinsurance.bicep gives them, which
            # are the driver's defaults.
            - configMapRef:
                name: ic-azure
          env:
            # The dropsBlobEndpoint output of infra/reinsurance.bicep. Left
            # out, statements and listings are only filed, not left for
            # reinsurers to collect.
            - name: IC_REINSURANCE_DROPS_ENDPOINT
              value: REPLACE-dropsBlobEndpoint
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cluster-token
              mountPath: /mnt/cluster-token
              readOnly: true
      volumes:
        - name: cluster-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ic-reinsurance-token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ic-reinsurance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ic-reinsurance

# The reinsurance driver (docs/reinsurance.md). It carries the reinsurance
# module's instructions from its group on the ledger nodes to the partitions
# and its notices to whoever they are for: other modules on the nodes, the
# write-once records container, and the event hub reinsurance operations
# are alerted from. It holds no state.
#
# It also serves the API reinsurers read their own statements and listings
# from (docs/reinsurance.md, "Reinsurers"), reached only through the ingress
# controller, which terminates TLS. Each reinsurer signs in with its own
# Entra client application; IC_REINSURANCE_API_CLIENTS maps each client ID
# to the reinsurer it is.
#
# It runs under an identity of its own, which may write to that container,
# send to that hub and read the cluster token. Set the values marked REPLACE
# from the outputs of infra/reinsurance.bicep and infra/main.bicep.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ic-reinsurance
  annotations:
    azure.workload.identity/client-id: REPLACE-reinsuranceIdentityClientId
---
# The cluster token, mounted as a file under the driver's identity. It never
# becomes a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ic-reinsurance-token
spec:
  provider: azure
  parameters:
    clientID: REPLACE-reinsuranceIdentityClientId
    keyvaultName: REPLACE-keyVaultName
    tenantId: REPLACE-tenantId
    objects: |
      array:
        - |
          objectName: cluster-token-ic-reinsurance
          objectAlias: cluster-token
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-reinsurance
spec:
  # Two, so delivery carries on when one dies. Both may run at once: the core
  # applies each instruction once, a record's name is written once, and a
  # notice published twice carries the same ID.
  replicas: 2
  selector:
    matchLabels:
      app: ic-reinsurance
  template:
    metadata:
      labels:
        app: ic-reinsurance
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ic-reinsurance
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driver
          image: insurance-core
          command: ["/usr/local/bin/ic-reinsurance"]
          envFrom:
            - configMapRef:
                name: ic-telemetry
            - configMapRef:
                name: ic-ledger
            # IC_BLOB_ENDPOINT and IC_EVENT_HUBS_ENDPOINT. The container and
            # hub have the names infra/reinsurance.bicep gives them, which
            # are the driver's defaults.
            - configMapRef:
                name: ic-azure
          env:
            # The dropsBlobEndpoint output of infra/reinsurance.bicep. Left
            # out, statements and listings are only filed, not left for
            # reinsurers to collect.
            - name: IC_REINSURANCE_DROPS_ENDPOINT
              value: REPLACE-dropsBlobEndpoint
            # The reinsurer API. Set, the other three are required. To serve
            # no API, leave all four out with the ports, probes, Service
            # and NetworkPolicy.
            - name: IC_REINSURANCE_API_LISTEN
              value: "0.0.0.0:8096"
            - name: IC_ENTRA_TENANT
              value: REPLACE-tenantId
            - name: IC_REINSURANCE_API_AUDIENCE
              value: REPLACE-reinsurer-api-app-id-uri
            # <client id>=<reinsurer>, comma separated, one entry for each
            # reinsurer's own app registration.
            - name: IC_REINSURANCE_API_CLIENTS
              value: REPLACE-reinsurer-clients
          ports:
            - name: http
              containerPort: 8096
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cluster-token
              mountPath: /mnt/cluster-token
              readOnly: true
      volumes:
        - name: cluster-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ic-reinsurance-token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ic-reinsurance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ic-reinsurance
---
apiVersion: v1
kind: Service
metadata:
  name: ic-reinsurance-api
spec:
  selector:
    app: ic-reinsurance
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The reinsurer API hears from the ingress controller's namespace and from
# nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ic-reinsurance-api
spec:
  podSelector:
    matchLabels:
      app: ic-reinsurance
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              insurance-core/ingress: "true"
      ports:
        - port: 8096

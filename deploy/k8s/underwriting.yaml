# The underwriting effects driver: carries the underwriting module's effects
# from its group on the ledger nodes to reinsurance, the core and group
# administration, publishes notices for staff to the `underwriting-notices`
# event hub, and runs the daily sweep (docs/underwriting.md). It holds no
# state.
#
# It runs under an identity of its own, which may read its own cluster token
# (cluster-token-ic-underwriting) and send to the underwriting hubs, nothing
# else; the ledger nodes hold it to the ic-underwriting grant in
# deploy/cluster-access/grants.json. Set the values marked REPLACE from the
# outputs of infra/underwriting.bicep and infra/main.bicep.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ic-underwriting
  annotations:
    azure.workload.identity/client-id: REPLACE-underwritingDriverIdentityClientId
---
# The cluster token, mounted as a file under the driver's identity. It never
# becomes a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ic-underwriting-token
spec:
  provider: azure
  parameters:
    clientID: REPLACE-underwritingDriverIdentityClientId
    keyvaultName: REPLACE-keyVaultName
    tenantId: REPLACE-tenantId
    objects: |
      array:
        - |
          objectName: cluster-token-ic-underwriting
          objectAlias: cluster-token
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-underwriting
spec:
  # Two, so delivery carries on when one dies. Both may run at once: every receiver
  # applies each instruction once.
  replicas: 2
  selector:
    matchLabels:
      app: ic-underwriting
  template:
    metadata:
      labels:
        app: ic-underwriting
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ic-underwriting
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driver
          image: insurance-core
          command: ["/usr/local/bin/ic-underwriting"]
          envFrom:
            - configMapRef:
                name: ic-ledger
            # IC_EVENT_HUBS_ENDPOINT. The hub has the name
            # infra/underwriting.bicep gives it, the driver's default.
            - configMapRef:
                name: ic-azure
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cluster-token
              mountPath: /mnt/cluster-token
              readOnly: true
      volumes:
        - name: cluster-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ic-underwriting-token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ic-underwriting
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ic-underwriting

# Who may talk to whom. Nothing in the namespace accepts a connection that
# is not listed here.
#
# These policies restrict reachability; they do not encrypt. Traffic between
# pods is plain HTTP carrying bearer tokens; the cluster encrypts it
# underneath with WireGuard (infra/main.bicep; docs/decisions.md,
# "Encryption in transit inside the cluster").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# The ledger nodes hear from each other (in this region, the other and the witness's), the API, the portal service, the workers, the close job,
# the bootstrap job, the reinsurance and underwriting drivers, the payments pump and its drill,
# and the ledger watch, and from nobody else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ic-node
spec:
  podSelector:
    matchLabels:
      app: ic-node
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ic-node", "ic-api", "ic-portal", "ic-worker", "ic-close", "ic-unit-orders", "ic-bootstrap", "ic-reinsurance", "ic-underwriting", "ic-payments-pump", "ic-payments-drill", "ic-watch"]
      ports:
        - port: 7000
    # The voters in the other regions and the witness, through their fixed
    # addresses (deploy/regions): the three networks infra/regions.bicep peers.
    - from:
        - ipBlock:
            cidr: 10.40.0.0/16
        - ipBlock:
            cidr: 10.41.0.0/16
        - ipBlock:
            cidr: 10.42.0.0/24
      ports:
        - port: 7000
---
# The API hears from the ingress controller's namespace. Label that namespace
# `insurance-core/ingress: "true"`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ic-api
spec:
  podSelector:
    matchLabels:
      app: ic-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              insurance-core/ingress: "true"
      ports:
        - port: 8080

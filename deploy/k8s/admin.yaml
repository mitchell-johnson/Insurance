# The operator's command, kept as a suspended CronJob so that it can be run
# by hand with the right identity, settings and token already in place:
#
#   kubectl -n insurance-core create job status-now --from=cronjob/ic-admin
#
# It never runs on its schedule. docs/operations.md shows how to run the
# other ic-admin commands from it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ic-admin
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: ic-bootstrap
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: ic-node
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: admin
              image: insurance-core
              command: ["/usr/local/bin/ic-admin", "status"]
              envFrom:
                - configMapRef:
                    name: ic-telemetry
                - configMapRef:
                    name: ic-ledger
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: cluster-token
                  mountPath: /mnt/cluster-token
                  readOnly: true
          volumes:
            - name: cluster-token
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: ic-node-token
---
# The ledger watch: every five minutes, ic-admin asks each node for its
# status and logs what is wrong (a node it cannot reach, a partition with no
# leader, a backlog of housekeeping, voters whose state hashes differ). The
# core's alert rules (infra/main.bicep, "alerts: the core") read those lines.
# The argument is the backlog limit per partition. It runs under its own
# identity and token (ic-watch), whose grant lets it read a node's status
# and nothing else.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ic-watch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: ic-watch
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: ic-watch
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watch
              image: insurance-core
              command: ["/usr/local/bin/ic-admin", "watch", "5000"]
              envFrom:
                - configMapRef:
                    name: ic-ledger
                - configMapRef:
                    name: ic-telemetry
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: cluster-token
                  mountPath: /mnt/cluster-token
                  readOnly: true
          volumes:
            - name: cluster-token
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: ic-watch-token

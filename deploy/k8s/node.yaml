# The ledger nodes: three replicas of every partition's Raft group.
apiVersion: v1
kind: Service
metadata:
  name: ic-node
spec:
  # Headless: each node is addressed by name, ic-node-<n>.ic-node.
  clusterIP: None
  # A node must be reachable by its peers before it is ready, or a cluster
  # that lost its quorum could never form one again.
  publishNotReadyAddresses: true
  selector:
    app: ic-node
  ports:
    - name: raft
      port: 7000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ic-node
spec:
  serviceName: ic-node
  replicas: 3
  # Pods are ic-node-1..3, and the number is the node's identity in Raft.
  ordinals:
    start: 1
  # All at once: a node alone cannot elect a leader, so waiting for the first
  # to be ready before starting the second would wait for ever.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ic-node
  template:
    metadata:
      labels:
        app: ic-node
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ic-node
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # One node per zone and per machine: losing either loses one replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ic-node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ic-node
      containers:
        - name: node
          image: insurance-core
          command: ["/usr/local/bin/ic-node"]
          envFrom:
            - configMapRef:
                name: ic-ledger
            - configMapRef:
                name: ic-azure
          env:
            - name: IC_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: IC_NODE_DATA_DIR
              value: /var/lib/ic/data
          ports:
            - name: raft
              containerPort: 7000
          # Alive is not the same as leading or caught up: a follower that is
          # behind must stay in the Service so that it can be caught up.
          startupProbe:
            httpGet:
              path: /healthz
              port: raft
            periodSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /healthz
              port: raft
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ic/data
            - name: cluster-token
              mountPath: /mnt/cluster-token
              readOnly: true
      volumes:
        - name: cluster-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ic-node-token
  # The Raft log, the vote and the snapshots. Losing this disk loses the
  # node's identity: it comes back shut out and is replaced under a new
  # number (docs/operations.md).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 128Gi
---
# A voluntary disruption (a node pool upgrade, a drain) may take one ledger
# node at a time: two of three keep every partition writable.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ic-node
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ic-node

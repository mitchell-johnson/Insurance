[package]
name = "ic-azure"
description = "Azure adapters: Entra workload identity, immutable Blob Storage, Key Vault signing, Event Hubs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ic-core.workspace = true
ic-ledger.workspace = true
ic-telemetry.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tokio.workspace = true
base64.workspace = true
tracing.workspace = true
axum = { workspace = true, optional = true }

[features]
# A local stand-in for the Azure endpoints, for this workspace's tests.
testing = ["dep:axum"]

[dev-dependencies]
ic-azure = { path = ".", features = ["testing"] }
axum.workspace = true
ic-sim.workspace = true
ic-money.workspace = true
ic-product.workspace = true

[lints]
workspace = true

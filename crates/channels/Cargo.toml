[package]
name = "ic-channels"
description = "The channels: customer app, adviser portal, employer portal, staff console and operations console, with identity, staff authorisation, audience-scoped read models and device sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ic-portal"
path = "src/main.rs"

[dependencies]
ic-telemetry.workspace = true
ic-core.workspace = true
ic-money.workspace = true
ic-ledger.workspace = true
ic-log.workspace = true
ic-readmodel.workspace = true
ic-api = { path = "../api" }
ic-raft.workspace = true
ic-azure.workspace = true
ic-entra.workspace = true
ic-product.workspace = true
# For its return definition loader only: the service reads that module as JSON.
ic-finance = { path = "../finance" }
# For the best-estimate dunning sequences it offers: the service reads that module as JSON.
ic-collections = { path = "../collections" }
reqwest.workspace = true
cedar-policy.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
base64.workspace = true
ring = "0.17"
futures = "0.3"
axum.workspace = true
# The MCP endpoint calls the portal's own routes; axum already depends on it.
tower.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# For the forwarder's contract test only: the service itself reads that module as JSON.
ic-distribution = { path = "../distribution" }
# For the unit pricing console's contract test only, as above.
ic-pricing = { path = "../pricing" }
ic-complaints = { path = "../complaints" }
ic-reinsurance = { path = "../reinsurance" }
ic-underwriting = { path = "../underwriting" }
ic-payments = { path = "../payments" }
ic-group = { path = "../group" }
ic-documents = { path = "../documents" }
ic-wellness = { path = "../wellness" }
ic-entra = { workspace = true, features = ["testing"] }
ic-sim.workspace = true
http-body-util.workspace = true
reqwest.workspace = true

[lints]
workspace = true

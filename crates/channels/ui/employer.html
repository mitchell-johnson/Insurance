<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employer portal</title><link rel="stylesheet" href="/ui/app.css"></head>
<body><header><h1>Employer portal</h1><button class="quiet" id="out">Sign out</button></header>
<main><div id="msg" aria-live="polite"></div>
<section><h2>Your schemes</h2><div id="schemes"></div></section>
<section id="detail" hidden><h2 id="title"></h2><div id="summary"></div><h2>Members</h2><div id="members"></div><h2>Billing</h2><div id="billing"></div></section>
<section id="manage" hidden><h2>Ask for a change</h2>
  <form id="change"><div class="row"><div><label for="kind">Change</label><select id="kind"><option value="add_member">Add a member</option><option value="remove_member">Remove a member</option><option value="change_salary">Change a member's salary</option></select></div>
  <div><label for="member">Member reference</label><input id="member" required maxlength="64"></div><div><label for="effective">Effective date</label><input id="effective" type="date" required></div><button>Send</button></div></form>
  <div id="change-msg" aria-live="polite"></div>
  <h2>Approve a colleague's change</h2><form id="approve"><div class="row"><div><label for="rid">Request</label><input id="rid" required></div><button>Approve</button></div></form><div id="approve-msg" aria-live="polite"></div>
  <h2>Administrators</h2><form id="admin"><div class="row"><div><label for="who">Person</label><input id="who" required></div><div><label for="is">Access</label><select id="is"><option value="true">Administrator</option><option value="false">Remove</option></select></div><button>Save</button></div></form>
  <form id="second"><label for="kinds">Changes that need a second administrator (comma separated)</label><div class="row"><input id="kinds" placeholder="remove_member, change_salary" size="40"><button>Save</button></div></form><div id="admin-msg" aria-live="polite"></div></section>
<section><h2>Your requests</h2><div id="requests"></div></section></main>
<script src="/ui/app.js"></script>
<script>
"use strict";
const { h, clear, put, money, table, say, signIn, signOut, api, run } = portal;
const $ = (id) => document.getElementById(id);
const R = "customers";
let scheme = null;
$("out").addEventListener("click", () => signOut(R));
async function requests() {
  const list = await api(R, "GET", "/app/v1/requests");
  put($("requests"), table(["Request", "Change", "State", "Approved by"], list.map((r) => [r.id, r.kind, String(r.status).replace(/_/g, " ") + (r.from ? " from a " + String(r.from).replace(/_/g, " ") : ""), r.approved_by || ""])));
}
async function open(s) {
  scheme = s.policy;
  const view = await api(R, "GET", "/app/v1/policies/" + encodeURIComponent(scheme));
  const of = (kind) => view.rows.filter((r) => r.kind === kind);
  $("detail").hidden = false; $("manage").hidden = false;
  $("title").textContent = `Scheme ${s.number}`;
  const sum = of("scheme")[0];
  put($("summary"), sum ? h("p", {}, `${sum.body.members} members, total cover ${money(sum.body.sum_insured_minor)}.`) : null);
  put($("members"), table(["Member", "Cover", "Sum insured", "In force"], of("member").map((r) => [r.body.life, r.body.cover, money(r.body.sum_insured_minor), r.body.in_force ? "yes" : "no"])));
  put($("billing"), table(["Item", "Details"], of("billing").map((r) => [r.key.split("/").slice(1).join(" "), h("pre", {}, JSON.stringify(r.body, null, 1))])));
}
async function load() {
  const schemes = await api(R, "GET", "/employer/v1/schemes");
  put($("schemes"), table(["Scheme", "Product", "Status", ""], schemes.map((s) => [s.number, s.product, s.status, h("button", { class: "quiet", on: { click: run($("msg"), () => open(s)) } }, "Open")])));
  await requests();
}
$("change").addEventListener("submit", run($("change-msg"), async () => {
  const sent = await api(R, "POST", "/app/v1/requests", { id: crypto.randomUUID(), policy: scheme, kind: $("kind").value, module: "group-admin", payload: { member: $("member").value, effective: $("effective").value } });
  await requests();
  return sent.effects.length ? "Sent." : "Sent. A second administrator needs to approve it before it goes ahead.";
}));
$("approve").addEventListener("submit", run($("approve-msg"), async () => { await api(R, "POST", `/app/v1/requests/${encodeURIComponent($("rid").value)}/approve`, {}); await requests(); return "Approved."; }));
$("admin").addEventListener("submit", run($("admin-msg"), async () => { await api(R, "PUT", `/employer/v1/schemes/${encodeURIComponent(scheme)}/admins/${encodeURIComponent($("who").value)}`, { admin: $("is").value === "true" }); return "Saved."; }));
$("second").addEventListener("submit", run($("admin-msg"), async () => { await api(R, "PUT", `/employer/v1/schemes/${encodeURIComponent(scheme)}/second-admin`, { changes: $("kinds").value.split(",").map((s) => s.trim()).filter(Boolean) }); return "Saved."; }));
signIn(R).then(load).catch((e) => say($("msg"), "bad", e.message));
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Service status · Insurance Core</title><link rel="stylesheet" href="/ui/app.css"><script src="/ui/theme.js"></script></head>
<body data-shell="public" data-page="status">
<main><header class="page"><div><h1>Service status</h1><p>Whether everything is working, in plain words.</p></div></header><section><div id="status" aria-live="polite"><p class="muted">Checking…</p></div></section><p class="muted" id="checked"></p></main>
<script src="/ui/app.js"></script>
<script>
"use strict";
const { h, clear, put } = portal;
const kinds = { operational: "ok", degraded: "warn", outage: "bad" };
async function refresh() {
  const box = document.getElementById("status");
  try {
    const page = await (await fetch("/status.json", { cache: "no-store" })).json();
    put(box, h("div", { class: "banner " + (kinds[page.level] || "warn") }, portal.icon(kinds[page.level] || "warn"), h("strong", {}, page.headline)), ...page.detail.map((line) => h("p", {}, line)));
  } catch {
    put(box, h("div", { class: "banner bad" }, portal.icon("bad"), h("strong", {}, "We cannot check the service right now")), h("p", {}, "Your cover is not affected. Please try again shortly."));
  }
  document.getElementById("checked").textContent = "Last checked " + new Date().toLocaleTimeString() + ". This page updates by itself.";
}
refresh(); setInterval(refresh, 30000);
</script></body></html>

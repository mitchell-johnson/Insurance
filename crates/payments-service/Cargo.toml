[package]
name = "ic-payments-service"
description = "The payments module's drivers: bank channels, the pump that works the module's outbox, and the evacuation drill"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-process bank for this workspace's tests. Never a real bank.
testing = ["dep:axum", "dep:rustls", "dep:tokio-rustls"]

[dependencies]
ic-payments = { path = "../payments" }
ic-core.workspace = true
ic-money.workspace = true
ic-cashmatch.workspace = true
ic-raft.workspace = true
ic-azure.workspace = true
chrono = { workspace = true, features = ["clock"] }
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
ic-payments-service = { path = ".", features = ["testing"] }
ic-sim.workspace = true
ic-log.workspace = true
ic-product.workspace = true
ic-azure = { workspace = true, features = ["testing"] }

[lints]
workspace = true

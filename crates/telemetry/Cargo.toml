[package]
name = "ic-telemetry"
description = "OpenTelemetry for every process: traces and logs over OTLP, W3C trace context across HTTP, the ledger, Event Hubs and Temporal, and no personal data in either"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "http-json", "gzip-http", "reqwest-blocking-client", "reqwest-rustls", "trace", "logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false }

[dev-dependencies]
tokio.workspace = true
tower.workspace = true
http-body-util.workspace = true
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"

[lints]
workspace = true

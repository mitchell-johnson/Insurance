name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Many pushes land on main in a short time. One run at a time per branch, and
# only the newest waiting run is kept, so the queue never grows and a run that
# has started always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Self-hosted runners keep their build output between runs (see "CI" in
  # docs/architecture.md), in CARGO_TARGET_DIR, one directory per job,
  # outside the checkout that actions/checkout cleans. Incremental builds
  # only pay off for edits made by hand.
  CARGO_INCREMENTAL: "0"
  # A job that finds its build output larger than this starts afresh.
  TARGET_DIR_LIMIT_GB: "60"
  # The line coverage the workspace must keep, tests against a real Temporal
  # server included.
  COVERAGE_FLOOR: "98"

jobs:
  checks:
    name: format, lints, test documentation
    # The runner image (tools/ci/runner/Dockerfile) has clang, protoc and
    # the well-known .proto files the build needs.
    runs-on: [self-hosted, insurance-ci]
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /data/target/checks
    steps:
      - uses: actions/checkout@v4
      - name: Keep the build output bounded
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          if [ "$(du -sk "$CARGO_TARGET_DIR" | cut -f1)" -gt $((TARGET_DIR_LIMIT_GB * 1024 * 1024)) ]; then
            echo "build output over ${TARGET_DIR_LIMIT_GB} GB: starting afresh"
            rm -rf "$CARGO_TARGET_DIR"
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Every test documents its purpose and why it matters
        run: python3 tools/check_test_docs.py
      - name: Only the money crate rounds a decimal
        run: python3 tools/check_rounding.py
      - name: The persona test matrix and its traceability to built tests hold together
        run: python3 tools/persona_matrix.py --check

  test:
    name: tests and coverage
    runs-on: [self-hosted, insurance-ci]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /data/target/test
      # The Mac's Docker machine has 20 GB for every job at once (the other
      # ci.yml jobs and the drill's image build included). Each instrumented
      # test executable links every dependency, and ten links at a time ran
      # it out of memory; six leave room.
      CARGO_BUILD_JOBS: "6"
    steps:
      - uses: actions/checkout@v4
      - name: Keep the build output bounded
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          if [ "$(du -sk "$CARGO_TARGET_DIR" | cut -f1)" -gt $((TARGET_DIR_LIMIT_GB * 1024 * 1024)) ]; then
            echo "build output over ${TARGET_DIR_LIMIT_GB} GB: starting afresh"
            rm -rf "$CARGO_TARGET_DIR"
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The containers this job starts carry the runner's name in a label, so
      # one a killed run left behind is removed by the next run here.
      - name: Remove services left by an earlier run on this runner
        run: docker ps -aq --filter "label=insurance-ci.runner=$RUNNER_NAME" | xargs -r docker rm -f
      # The servers publish no ports, so nothing is opened on the Mac or the
      # LAN and runs never contend for a port. The runner shares the Docker
      # machine's network and reaches Temporal at the container's address.
      - name: Start a Temporal server
        run: |
          name=ci-temporal-${{ github.run_id }}-${{ github.run_attempt }}
          docker run -d --name "$name" --label "insurance-ci.runner=$RUNNER_NAME" temporalio/temporal:1.10.0 server start-dev --ip 0.0.0.0
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$name")
          echo "IC_TEST_TEMPORAL_ADDRESS=$ip:7233" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if (exec 3<>"/dev/tcp/$ip/7233") 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$name"
          exit 1
      # The customer master's store tests: each test makes its own database.
      # Its connector refuses a server without TLS anywhere but the loopback,
      # so this one shares the Docker machine's network with the runner and
      # listens on 127.0.0.1 only, at a port free when the job starts.
      - name: Start a PostgreSQL server
        run: |
          name=ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          docker run -d --name "$name" --label "insurance-ci.runner=$RUNNER_NAME" --network host -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16 -c listen_addresses=127.0.0.1 -c port="$port" -c max_connections=300 -c fsync=off
          echo "IC_TEST_POSTGRES_URL=host=127.0.0.1 port=$port user=postgres dbname=postgres" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres -h 127.0.0.1 -p "$port" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs "$name"
          exit 1
      # The telemetry crate's test against a real OpenTelemetry Collector: the
      # image and configuration deploy/k8s ships, on the Docker machine's
      # network and the loopback only, sending on to the test.
      - name: Start an OpenTelemetry Collector
        run: |
          tools/ci/start-collector.sh "ci-otel-${{ github.run_id }}-${{ github.run_attempt }}" "insurance-ci.runner=$RUNNER_NAME" >> "$GITHUB_ENV"
      - name: Tests, with the coverage floor
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info --fail-under-lines "$COVERAGE_FLOOR"
      - name: Coverage by file
        if: always()
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Uncovered lines by file
        if: always()
        run: test ! -f lcov.info || python3 tools/coverage_floor.py lcov.info 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: ignore
      - name: Stop the servers
        if: always()
        run: docker ps -aq --filter "label=insurance-ci.runner=$RUNNER_NAME" | xargs -r docker rm -f

  infrastructure:
    name: Azure template and Kubernetes manifests
    runs-on: [self-hosted, insurance-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Every template in infra/, so one a module adds beside main.bicep is
      # compiled too. The runner image has the Bicep CLI that `az bicep`
      # wraps, at a pinned version.
      - name: Compile the Bicep templates
        run: |
          for template in infra/*.bicep; do
            echo "$template"
            bicep build "$template" --stdout > /dev/null
          done
      - name: Compile its parameters
        run: bicep build-params infra/main.bicepparam --stdout > /dev/null
      - name: Render the Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s > /dev/null
          for region in deploy/regions/*/; do
            echo "$region"
            kubectl kustomize "$region" > /dev/null
          done
      # The ledger's voters are named in the templates, the overlays and the
      # settings; they must agree (deploy/regions/README.md).
      - name: Check the regions agree
        run: python3 tools/check_regions.py

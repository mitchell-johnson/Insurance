name: drill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The drill builds the shipped image in the release profile, which takes
# longer than the whole test suite. It has its own queue so the tests and the
# coverage floor report at their own pace. One run at a time per branch, and
# only the newest waiting run is kept; a run that has started always finishes.
concurrency:
  group: drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resilience:
    name: image and failure drill
    # Its own runner: the cluster's Compose project name and ports are fixed,
    # so only one drill can run on the Mac at a time.
    runs-on: [self-hosted, insurance-drill]
    timeout-minutes: 90
    env:
      # See [profile.drill] in Cargo.toml.
      CARGO_PROFILE: drill
      # Other services on the Mac hold 8080; these ports are free there.
      IC_COMPOSE_API_PORT: "18080"
      IC_COMPOSE_PORTAL_PORT: "18090"
      IC_COMPOSE_TEMPORAL_PORT: "17233"
      IC_COMPOSE_TEMPORAL_UI_PORT: "18233"
    steps:
      - uses: actions/checkout@v4
      # Builds the shipped image, starts three ledger nodes, Temporal, two
      # workers and the API from it, then kills nodes and a worker, destroys
      # a node's disk and replaces the node, checking the books throughout.
      - name: Failure drill on the Compose cluster
        run: deploy/compose/chaos.sh
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 200
      # The drill builds its image on the Mac's Docker each run; keep only
      # the newest so old ones do not pile up.
      - name: Remove superseded drill images
        if: always()
        run: docker image prune -f --filter "label=com.docker.compose.project=insurance-core"
